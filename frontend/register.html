<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="telegram.js"></script>
    <script src="authFetch.js"></script>
    <script src="autoAuth.js?v=3"></script>
    <script src="authApi.js"></script>
    <script src="autoAuth.js?v=3"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="telegram.js"></script>
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0B0B;
            --card: #1A1A1A;
            --green: #C6FF33;
            --text: #fff;
            --dim: #888;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .app { width: 100%; max-width: 400px; padding-bottom: 100px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .sub { color: var(--dim); font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
        input {
            width: 100%; padding: 14px 16px; margin-bottom: 16px;
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            color: var(--text); font-size: 15px; outline: none;
        }
        input:focus { border-color: var(--green); }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 16px;
            background: var(--green); color: #000; font-weight: 700; font-size: 16px;
            cursor: pointer; margin-top: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .link { display: block; text-align: center; margin-top: 20px; color: var(--green); text-decoration: none; font-weight: 600; }
        .back { color: var(--dim); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="app">
    <a href="profile.html" class="back">← Назад</a>
    <h1>Регистрация</h1>
    <p class="sub">Имя и пароль — промпты сохранятся в облаке</p>
    <form id="regForm" action="#" method="post" novalidate>
        <label for="name">Имя</label>
        <input id="name" type="text" placeholder="Как к тебе обращаться" required maxlength="100" autocomplete="username">
        <label for="password">Пароль</label>
        <input id="password" type="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password">
        <button class="btn" type="button" id="submitBtn">Зарегистрироваться</button>
    </form>
    <a href="login.html" class="link">Уже есть аккаунт? Войти</a>
</div>
<script src="authApi.js"></script>
<script>
const form = document.getElementById('regForm');
const submitBtn = document.getElementById('submitBtn');

async function doRegister() {
    if (!window.AuthApi) return;
    const name = document.getElementById('name').value.trim();
    const password = document.getElementById('password').value;
    if (!name || password.length < 6) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Регистрация…';
    try {
        await AuthApi.register(name, password);
        window.location.href = 'profile.html';
    } catch (err) {
        console.warn('Регистрация:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';
    }
}

submitBtn.addEventListener('click', doRegister);
form.addEventListener('submit', (e) => {
    e.preventDefault();
    doRegister();
});
</script>
</body>
</html>
