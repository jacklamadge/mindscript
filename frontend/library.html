<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="navbar.js?v=2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="telegram.js"></script>
    <script src="autoAuth.js?v=3"></script>
    <script src="authApi.js"></script>
    <script src="telegram.js"></script>
    <script src="libraryApi.js"></script>
    <script src="referral.js?v=3"></script>
    <script src="premium.js?v=4"></script>
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mindscript - Библиотека</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B0B0B;
            --card-bg: #161616;
            --accent-green: #C6FF33;
            --accent-red: #ff4444;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --border: rgba(255,255,255,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; }
        .app { width: 100%; max-width: 400px; padding-bottom: 120px; }
        .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        h1 { font-size: 32px; font-weight: 800; }
        .back-btn { background: none; border: none; color: var(--accent-green); cursor: pointer; font-weight: 600; display: none; font-size: 16px; }
        .search-container {
            background: var(--card-bg); border-radius: 20px; padding: 15px 20px;
            display: flex; align-items: center; gap: 12px; margin-bottom: 30px; border: 1px solid var(--border);
        }
        .search-container input { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; }
        .tabs-container {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 25px;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs {
            display: flex;
            gap: 10px;
            width: max-content;
            padding: 0 0 4px 0;
        }
        .tab { 
            background: #1A1A1A; color: var(--text-dim); font-size: 14px; font-weight: 600; 
            padding: 8px 20px; border-radius: 100px; cursor: pointer; white-space: nowrap; transition: 0.2s; border: none;
            flex-shrink: 0;
        }
        .tab.active { background: var(--accent-green); color: #000; }
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item {
            background: var(--card-bg); border-radius: 18px; padding: 12px 16px;
            display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s;
        }
        .list-item:hover { border-color: var(--accent-green); }
        .item-icon { width: 40px; height: 40px; background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .item-info { flex-grow: 1; overflow: hidden; }
        .item-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .item-meta { font-size: 11px; color: var(--text-dim); }
        .item-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .action-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 16px; padding: 5px; transition: 0.2s; }
        .action-btn:hover { color: var(--accent-green); }
        .action-btn.favorite-added { color: var(--accent-green); cursor: default; }
        .delete-btn:hover { color: var(--accent-red); }
        .add-card { border: 1px dashed #333; background: transparent; justify-content: center; color: var(--accent-green); font-weight: 700; gap: 8px; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: #1A1A1A; padding: 24px; border-radius: 24px; width: 100%; max-width: 340px; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; background: #222; border: 1px solid #333; border-radius: 12px; color: white; margin: 10px 0; outline: none; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; }
        .btn-cancel { background: #333; color: white; }
        .btn-confirm { background: var(--accent-green); color: black; }
        .view-text {
            max-height: 50vh; overflow-y: auto; font-size: 13px; line-height: 1.5;
            color: #ccc; white-space: pre-wrap; margin: 12px 0;
        }
        .loading-msg { text-align: center; color: #444; margin-top: 40px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header-row">
        <h1 id="page-title">Библиотека</h1>
        <button class="back-btn" id="back-btn" onclick="goBack()">← Назад</button>
    </div>

    <div class="search-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Поиск..." oninput="render()">
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabs-bar">
            <button class="tab" data-tab="favorites" onclick="switchTab(this, 'favorites')">⭐ Избранное</button>
            <button class="tab" data-tab="history" onclick="switchTab(this, 'history')">📜 История</button>
            <button class="tab" data-tab="collections" onclick="switchTab(this, 'collections')">📁 Коллекции</button>
        </div>
    </div>
    <!-- 🔍 ПОИСК ПО БИБЛИОТЕКЕ -->
    <style>
    #libSearchWrap { position: relative; margin: 12px 16px; }
    #libSearchInput {
        width: 100%; box-sizing: border-box;
        background: #1A1A1A; border: 1px solid rgba(255,255,255,0.1);
        color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px;
        outline: none;
    }
    #libSearchInput:focus { border-color: #C6FF33; }
    #libSearchResults {
        display: none; position: absolute; top: 100%; left: 0; right: 0;
        background: #1A1A1A; border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px; margin-top: 6px; max-height: 320px; overflow: auto;
        z-index: 1500; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .ls-item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .ls-item:hover { background: #242424; }
    .ls-title { color: #fff; font-size: 14px; font-weight: 600; }
    .ls-meta { color: #888; font-size: 12px; margin-top: 2px; }
    .ls-empty { color: #888; text-align: center; padding: 20px 0; }
    </style>

    <div id="libSearchWrap">
    <input id="libSearchInput" type="search" placeholder="🔍 Поиск по библиотеке..." autocomplete="off">
    <div id="libSearchResults"></div>
    </div>

    <script>
    (function () {
    const input = document.getElementById('libSearchInput');
    const results = document.getElementById('libSearchResults');
    let timer = null;
    let cache = null;

    // Собираем все промпты из истории, избранного и коллекций
    async function loadAll() {
        await LibraryApi.ensureReady();
        const [history, favorites, collections] = await Promise.all([
        LibraryApi.loadHistory(),
        LibraryApi.loadFavorites(),
        LibraryApi.loadCollections(),
        ]);
        const items = [];
        history.forEach(i => items.push(Object.assign({}, i, { source: '📜 История' })));
        favorites.forEach(i => items.push(Object.assign({}, i, { source: '⭐ Избранное' })));
        (collections || []).forEach(c =>
        (c.items || []).forEach(i => items.push(Object.assign({}, i, { source: '📁 ' + c.name })))
        );
        cache = items;
        return items;
    }

    function render(list, q) {
        results.innerHTML = '';
        if (!q) { results.style.display = 'none'; return; }
        results.style.display = 'block';
        if (!list.length) {
        results.innerHTML = '<div class="ls-empty">Ничего не найдено</div>';
        return;
        }
    list.slice(0, 30).forEach(item => {
      const el = document.createElement('div');
      el.className = 'ls-item';
      const t = document.createElement('div');
      t.className = 'ls-title';
      t.textContent = item.title || 'Промпт';
      const m = document.createElement('div');
      m.className = 'ls-meta';
      m.textContent = item.source + (item.meta ? ' · ' + item.meta : '');
      el.appendChild(t); el.appendChild(m);
      el.onclick = () => openViewer(item);
      results.appendChild(el);
    });
  }

    // Просмотр промпта + копирование
    function openViewer(item) {
        let overlay = document.getElementById('lsViewer');
        if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'lsViewer';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;';
        overlay.innerHTML =
            '<div style="background:#1A1A1A;border:1px solid rgba(255,255,255,.1);border-radius:16px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;padding:16px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
                '<b id="lsViewerTitle" style="color:#fff;"></b>' +
                '<button id="lsViewerClose" style="background:none;border:none;color:#888;font-size:18px;cursor:pointer;">✕</button>' +
            '</div>' +
            '<pre id="lsViewerText" style="color:#ddd;white-space:pre-wrap;overflow:auto;flex:1;font-family:inherit;font-size:14px;line-height:1.5;margin:0;"></pre>' +
            '<button id="lsViewerCopy" style="margin-top:12px;background:#C6FF33;border:none;color:#000;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;">📋 Копировать</button>' +
            '</div>';
        document.body.appendChild(overlay);
        overlay.querySelector('#lsViewerClose').onclick = () => { overlay.style.display = 'none'; };
        overlay.querySelector('#lsViewerCopy').onclick = () => {
            navigator.clipboard.writeText(overlay.querySelector('#lsViewerText').textContent);
            if (window.Toast) Toast.success('✅ Скопировано!');
        };
        }
        overlay.querySelector('#lsViewerTitle').textContent = item.title || 'Промпт';
        overlay.querySelector('#lsViewerText').textContent = item.text || '';
        overlay.style.display = 'flex';
        results.style.display = 'none';
    }

    async function doSearch() {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) { render([], ''); return; }
        try {
        if (!cache) await loadAll();
        const list = cache.filter(i =>
            ((i.title || '') + ' ' + (i.text || '')).toLowerCase().includes(q)
        );
        render(list, q);
        } catch (e) {
        console.warn('Поиск:', e);
        }
    }

    input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(doSearch, 250); // debounce
    });

    // Обновляем кэш при кликах по вкладкам (данные могли измениться)
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#libSearchWrap')) cache = null;
    });
    })();
    </script>
    <div id="content-list" class="list-container"></div>
</div>

<div class="modal" id="modal-collection-select">
    <div class="modal-content">
        <h3>Добавить в коллекцию</h3>
        <select id="collection-select"></select>
        <button id="newCollectionBtn" style="width:100%; padding:10px; background:#333; border:none; border-radius:12px; color:white; margin-top:10px; cursor:pointer;" onclick="openCreateCollectionModal()">+ Создать новую</button>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-confirm" onclick="addToSelectedCollection()">Добавить</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-create-collection">
    <div class="modal-content">
        <h3>Новая коллекция</h3>
        <input type="text" id="new-col-name" placeholder="Название коллекции">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-confirm" onclick="createNewCollectionAndAdd()">Создать</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-view">
    <div class="modal-content">
        <h3 id="view-title">Промпт</h3>
        <div class="view-text" id="view-text"></div>
        <div class="modal-buttons">
            <button class="btn-confirm" onclick="closeModal()">Закрыть</button>
        </div>
    </div>
</div>

<script src="authApi.js"></script>
<script src="libraryApi.js"></script>
<script>
let historyData = [];
let favoritesData = [];
let collectionsData = [];
let currentTab = 'favorites';
let activeCollectionId = null;
let pendingItem = null;
let isLoading = true;

async function refreshData() {
    await LibraryApi.ensureReady();
    [historyData, favoritesData, collectionsData] = await Promise.all([
        LibraryApi.loadHistory(),
        LibraryApi.loadFavorites(),
        LibraryApi.loadCollections(),
    ]);
}

function initTabFromUrl() {
    const tabFromUrl = new URLSearchParams(window.location.search).get('tab');
    const tabs = document.querySelectorAll('.tab');
    let targetTab = 'favorites';
    if (tabFromUrl === 'history') targetTab = 'history';
    else if (tabFromUrl === 'collections') targetTab = 'collections';
    else if (tabFromUrl === 'favorites') targetTab = 'favorites';
    currentTab = targetTab;
    tabs.forEach(tab => {
        if (tab.getAttribute('data-tab') === targetTab) tab.classList.add('active');
        else tab.classList.remove('active');
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

function openView(title, text) {
    document.getElementById('view-title').textContent = title || 'Промпт';
    document.getElementById('view-text').textContent = text || '';
    document.getElementById('modal-view').style.display = 'flex';
}

function goBack() {
    activeCollectionId = null;
    render();
}

function closeModal() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
}

function findFavoriteForItem(item) {
    if (!item) return null;
    if (item.prompt_record_id) {
        const byRecord = favoritesData.find((f) => f.prompt_record_id === item.prompt_record_id);
        if (byRecord) return byRecord;
    }
    return favoritesData.find((f) => f.text === item.text) || null;
}

async function addItemToFavorites(item) {
    if (!item || findFavoriteForItem(item)) return;
    try {
        await LibraryApi.addFavorite(item.text, item.title, item.prompt_record_id);
        await refreshData();
        render();
    } catch (e) {
        console.warn(e);
    }
}

function createListItem(title, meta, onClick, onDelete, onAddToCollection, historyItem) {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.onclick = onClick;
    const showFavoriteBtn = !!historyItem;
    div.innerHTML = `
        <div class="item-icon">📄</div>
        <div class="item-info">
            <div class="item-title">${escapeHtml(title.slice(0, 50))}</div>
            <div class="item-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="item-actions">
            ${showFavoriteBtn ? '<button class="action-btn add-to-favorite" title="В избранное">⭐</button>' : ''}
            ${onAddToCollection ? '<button class="action-btn add-to-collection" title="Добавить в коллекцию">📁</button>' : ''}
            <button class="action-btn delete-btn" title="Удалить">🗑️</button>
        </div>
    `;
    if (showFavoriteBtn) {
        const favBtn = div.querySelector('.add-to-favorite');
        if (findFavoriteForItem(historyItem)) {
            favBtn.textContent = '✓';
            favBtn.classList.add('favorite-added');
            favBtn.title = 'Уже в избранном';
        } else {
            favBtn.onclick = (e) => {
                e.stopPropagation();
                addItemToFavorites(historyItem);
            };
        }
    }
    if (onAddToCollection) {
        div.querySelector('.add-to-collection').onclick = (e) => {
            e.stopPropagation();
            onAddToCollection();
        };
    }
    div.querySelector('.delete-btn').onclick = (e) => {
        e.stopPropagation();
        onDelete();
    };
    return div;
}

function openCollectionSelectModal() {
    const select = document.getElementById('collection-select');
    select.innerHTML = '<option value="">-- Выберите коллекцию --</option>';
    collectionsData.forEach(col => {
        select.innerHTML += `<option value="${col.id}">${escapeHtml(col.name)}</option>`;
    });
    document.getElementById('modal-collection-select').style.display = 'flex';
}

function openCreateCollectionModal() {
    document.getElementById('modal-create-collection').style.display = 'flex';
}

async function addToSelectedCollection() {
    const select = document.getElementById('collection-select');
    const collectionId = parseInt(select.value, 10);
    if (!collectionId || !pendingItem) {
        
        return;
    }
    try {
        await LibraryApi.addToCollection(
            collectionId,
            pendingItem.text,
            pendingItem.title,
            pendingItem.prompt_record_id
        );
        const collection = collectionsData.find(c => c.id === collectionId);
        closeModal();
        await refreshData();
        render();
    } catch (e) {
        console.warn(e);
    }
    pendingItem = null;
}

async function createNewCollectionAndAdd() {
    const name = document.getElementById('new-col-name').value.trim();
    if (!name) return;
    try {
        const col = await LibraryApi.createCollection(name);
        if (pendingItem) {
            await LibraryApi.addToCollection(
                col.id,
                pendingItem.text,
                pendingItem.title,
                pendingItem.prompt_record_id
            );
        }
        closeModal();
        await refreshData();
        render();
    } catch (e) {
        console.warn(e);
    }
    pendingItem = null;
    document.getElementById('new-col-name').value = '';
}

function render() {
    const list = document.getElementById('content-list');
    const search = document.getElementById('search-input').value.toLowerCase();
    list.innerHTML = '';

    if (isLoading) {
        list.innerHTML = '<div class="loading-msg">Загрузка…</div>';
        return;
    }

    if (activeCollectionId) {
        const col = collectionsData.find(c => c.id === activeCollectionId);
        if (col) {
            document.getElementById('page-title').innerText = col.name;
            document.getElementById('back-btn').style.display = 'block';
            document.getElementById('tabs-bar').parentElement.style.display = 'none';
            const filtered = (col.items || []).filter(i =>
                i.title.toLowerCase().includes(search) || (i.text || '').toLowerCase().includes(search)
            );
            filtered.forEach((item) => {
                list.appendChild(createListItem(item.title, item.meta || LibraryApi.formatDate(item.date), () => openView(item.title, item.text), async () => {
                    try {
                        await LibraryApi.deleteCollectionItem(activeCollectionId, item.id);
                        await refreshData();
                        render();
                    } catch (e) {
                        console.warn(e);
                    }
                }, null));
            });
            if (filtered.length === 0) list.innerHTML = '<div style="text-align:center; color:#444; margin-top:40px;">📭 Пустая коллекция</div>';
        }
    } else {
        document.getElementById('page-title').innerText = 'Библиотека';
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('tabs-bar').parentElement.style.display = 'block';

        if (currentTab === 'collections') {
            const addBtn = document.createElement('div');
            addBtn.className = 'list-item add-card';
            addBtn.innerHTML = '+ Создать коллекцию';
            addBtn.onclick = () => openCreateCollectionModal();
            list.appendChild(addBtn);
            
            const filteredCols = collectionsData.filter(c => c.name.toLowerCase().includes(search));
            filteredCols.forEach(col => {
                list.appendChild(createListItem(col.name, `${col.items?.length || 0} элементов`, () => { activeCollectionId = col.id; render(); }, async () => {
                    if (!confirm(`Удалить коллекцию «${col.name}»?`)) return;
                    try {
                        await LibraryApi.deleteCollection(col.id);
                        await refreshData();
                        render();
                    } catch (e) {
                        console.warn(e);
                    }
                }, null));
            });
        } else {
            let source = (currentTab === 'history') ? historyData : favoritesData;
            const filtered = source.filter(item =>
                item.title.toLowerCase().includes(search) || (item.text || '').toLowerCase().includes(search)
            );
            filtered.forEach((item) => {
                list.appendChild(createListItem(
                    item.title,
                    item.meta || LibraryApi.formatDate(item.date),
                    () => openView(item.title, item.text),
                    async () => {
                        try {
                            if (currentTab === 'history') {
                                await LibraryApi.deleteHistory(item.id);
                            } else {
                                await LibraryApi.deleteFavorite(item.id);
                            }
                            await refreshData();
                            render();
                        } catch (e) {
                            console.warn(e);
                        }
                    },
                    () => {
                        pendingItem = item;
                        openCollectionSelectModal();
                    },
                    currentTab === 'history' ? item : null
                ));
            });
            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#444; margin-top:40px;">✨ Здесь пока пусто</div>';
            }
        }
    }
}

function switchTab(el, tab) {
    currentTab = tab;
    activeCollectionId = null;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
    const url = new URL(window.location);
    url.searchParams.set('tab', tab);
    window.history.pushState({}, '', url);
}

initTabFromUrl();
render();

(async function initLibrary() {
    try {
        await refreshData();
    } catch (e) {
        console.warn('Библиотека:', e);
        document.getElementById('content-list').innerHTML =
            '<div class="loading-msg">✨ Здесь пока пусто</div>';
    } finally {
        isLoading = false;
        render();
    }
})();

window.addEventListener('popstate', () => {
    initTabFromUrl();
    render();
});
</script>
</body>
</html>
